<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="800px" height="800px" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes nhPulse {
      0% { transform: scaleY(0.85); opacity: 0.6; }
      50% { transform: scaleY(1); opacity: 1; }
      100% { transform: scaleY(0.85); opacity: 0.6; }
    }
    @keyframes nhHalo {
      0% { filter: drop-shadow(0 0 0.3px rgba(198, 169, 97, 0.16)); }
      50% { filter: drop-shadow(0 0 0.8px rgba(198, 169, 97, 0.26)); }
      100% { filter: drop-shadow(0 0 0.3px rgba(198, 169, 97, 0.16)); }
    }
    @keyframes nhMark {
      0% { opacity: 0.72; }
      50% { opacity: 0.96; }
      100% { opacity: 0.72; }
    }
    .nh-signal-bar {
      transform-box: fill-box;
      transform-origin: center bottom;
      animation: nhPulse 1.6s cubic-bezier(0.4, 0, 0.2, 1) infinite, nhHalo 1.6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      will-change: transform, opacity, filter;
    }
    .nh-bar-1 { animation-delay: 0s, 0s; }
    .nh-bar-2 { animation-delay: 0.12s, 0.12s; }
    .nh-bar-3 { animation-delay: 0.24s, 0.24s; }
    .nh-bar-4 { animation-delay: 0.36s, 0.36s; }
    .nh-bar-5 { animation-delay: 0.48s, 0.48s; }
    .nh-signal-mark {
      fill: #bda65e;
      animation: nhMark 1.6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      animation-delay: 0.24s;
    }
  </style>
